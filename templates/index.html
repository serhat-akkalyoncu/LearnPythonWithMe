<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Tarayıcı sekmesindeki başlığa adını ekledik -->
    <title>Serhat Akkalyoncu ile Python Öğreniyorum</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; margin: 0; background-color: #f4f4f9; }
        #sidebar { width: 280px; background: #2c3e50; color: white; display: flex; flex-direction: column; }
        .sidebar-section { padding: 15px; display: flex; flex-direction: column; flex: 1; border-bottom: 2px solid #1a252f; overflow: hidden; }
        .sidebar-section h2 { margin-top: 0; margin-bottom: 5px; font-size: 18px; color: #ecf0f1; }
        
        /* Adını göstermek için yeni bir stil */
        .developer-name { font-size: 12px; color: #f39c12; margin-bottom: 10px; font-weight: bold; letter-spacing: 0.5px; }
        
        .scrollable-list { overflow-y: auto; flex: 1; }
        .example-list { list-style: none; padding: 0; margin: 0; }
        .example-list li { cursor: pointer; padding: 10px; border-bottom: 1px solid #34495e; font-size: 14px; }
        .example-list li:hover { background-color: #34495e; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #2c3e50; }
        ::-webkit-scrollbar-thumb { background: #7f8c8d; border-radius: 3px; }

        #content { flex-grow: 1; display: flex; flex-direction: column; padding: 20px; width: calc(100% - 280px); }
        #editor-container { flex-grow: 1; margin: 15px 0; border: 1px solid #ccc; border-radius: 4px; overflow: hidden; min-height: 250px; }
        #output-container { height: 150px; background: #1e1e1e; color: #00ff00; padding: 15px; font-family: monospace; border-radius: 4px; overflow-y: auto; }
        button { padding: 10px 20px; background-color: #27ae60; color: white; border: none; cursor: pointer; font-size: 16px; border-radius: 4px; font-weight: bold;}
        button:hover { background-color: #2ecc71; }
        .error-text { color: #e74c3c; }
    </style>
</head>
<body>
    <div id="sidebar">
        <!-- Dinamik Konu Listesi -->
        <div class="sidebar-section">
            <h2>Python Konuları</h2>
            <!-- Sol menüye ismini ekledik -->
            <div class="developer-name">Geliştirici: Serhat Akkalyoncu</div>
            <div class="scrollable-list">
                <ul id="topic-list" class="example-list"></ul>
            </div>
        </div>
        <!-- Dinamik Örnek Listesi -->
        <div class="sidebar-section">
            <h2>Konu Örnekleri</h2>
            <div class="scrollable-list">
                <ul id="example-list" class="example-list"></ul>
            </div>
        </div>
    </div>
    
    <div id="content">
        <h1 id="topic-title">Yükleniyor...</h1>
        <p id="topic-description">Lütfen bekleyin, konular klasörden okunuyor...</p>
        <p style="background: #e1e8ed; padding: 10px; border-radius: 5px; border-left: 5px solid #2980b9;">
            <strong id="example-explanation">Örnek açıklaması burada yer alacak.</strong>
        </p>
        
        <div id="editor-container"></div>
        
        <div>
            <button onclick="runCode()">Kodu Çalıştır</button>
        </div>
        
        <h3 style="margin-bottom: 5px; margin-top: 15px;">Sonuç (Terminal):</h3>
        <div id="output-container">Çıktı bekleniyor...</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.36.1/min/vs/loader.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
